# ansible-core with git (playbooks from repositories) and the SSH client, pinned, on Python's slim
# image. Built once per agent and cached. Collections and roles come from each repository's
# requirements.yml at run time.
id: ansible
name: Ansible
description: ansible-core 2.18 with git and OpenSSH, for running playbooks against the hosts an agent can reach
tags: [ansible, configuration]
homepage: https://docs.ansible.com/
build:
  base: docker.io/library/python:3.12-slim
  install: |
    apt-get update
    apt-get install -y --no-install-recommends git openssh-client sshpass ca-certificates
    rm -rf /var/lib/apt/lists/*
    pip install --no-cache-dir "ansible-core==2.18.6" "jmespath==1.0.1"
  check: ansible-playbook --version && git --version && ssh -V
