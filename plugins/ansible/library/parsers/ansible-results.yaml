# What each task did on each host, from the plugin's callback (castor_results.py): one record per
# task result, in the order they happened.
id: ansible-results
name: Ansible task results
description: What each task of an Ansible run did on each host (ok, changed, failed, unreachable, skipped)
type: list<object>
format: javascript
code: |
  function parse(text) {
    const data = JSON.parse(text);
    return (data.results || []).map((r) => ({
      host: r.host, status: r.status, task: r.task, play: r.play, action: r.action,
      changed: !!r.changed, msg: r.msg || "", rc: r.rc === undefined ? null : r.rc, duration: r.duration,
    }));
  }
