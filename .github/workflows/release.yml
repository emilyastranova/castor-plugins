# On main: release every plugin whose version has no release yet (tag <id>-v<version>).
name: Release
on:
  push:
    branches: [main]
    paths: ["plugins/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: emilyastranova/castor
          path: .castor
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".castor/server"
      - name: Check before releasing
        run: python scripts/check_directory.py
      - name: Release new versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/release.py
